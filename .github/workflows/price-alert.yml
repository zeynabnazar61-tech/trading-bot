name: Preis-Alarm

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests python-dotenv

      - name: Preis-Alarm pruefen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_alert.py

      - name: Preis-Stand committen (falls geaendert)
        run: |
          git config user.name "price-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/price_alert_state.json
          git diff --staged --quiet || git commit -m "Update price alert state [skip ci]"
          git push
